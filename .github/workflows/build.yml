name: Build SleepMode RootHide

on:
  push:
    branches: [feature/core]
  pull_request:
    branches: [feature/core]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          XCODE_PATH="/Applications/Xcode_26.6.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode 26.6 not found"; ls -d /Applications/Xcode*.app || true; exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        run: brew install ldid xz perl dpkg

      - name: Install RootHide Theos
        run: |
          set -e
          git clone --depth=1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          "$HOME/theos/bin/update-theos"

      - name: Install dm.pl and SDK
        run: |
          set -e
          git clone --depth=1 https://github.com/theos/dm.pl.git /tmp/dm.pl
          cp /tmp/dm.pl/dm.pl "$HOME/theos/bin/dm.pl"
          chmod +x "$HOME/theos/bin/dm.pl"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p "$HOME/theos/sdks"
          test -d /tmp/theos-sdks/iPhoneOS16.5.sdk
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"

      - name: Validate sources and plists
        run: |
          set -e
          test -f SleepMode/prebuilt/SleepMode.dylib
          test -f SleepMode/prebuilt/SleepMode.plist
          test -f SleepMode/Tweak.xm
          test -f SleepMode/SleepModeSettingsBridge.plist
          test ! -f SleepMode/SleepManager.m
          test -f SleepModePrefs/SleepModePrefs.m
          test -f SleepModePrefs/SleepModeTimeoutController.m
          test -f SleepModePrefs/Resources/Root.plist
          test -f SleepModePrefs/Resources/icon.png
          plutil -lint SleepMode/prebuilt/SleepMode.plist
          plutil -lint SleepMode/SleepModeSettingsBridge.plist
          plutil -lint SleepModePrefs/Resources/Root.plist
          plutil -lint SleepModePrefs/entry.plist

      - name: Build Preferences bundle
        run: |
          set -e
          export THEOS="$HOME/theos"
          make -C SleepModePrefs clean
          make -C SleepModePrefs all THEOS_PACKAGE_SCHEME=roothide
          PREFS_BUNDLE="$(find SleepModePrefs -type d -name SleepModePrefs.bundle -print | head -n 1)"
          test -n "$PREFS_BUNDLE"
          test -f "$PREFS_BUNDLE/SleepModePrefs"
          test -f "$PREFS_BUNDLE/Root.plist"
          test -f "$PREFS_BUNDLE/icon.png"
          mkdir -p /tmp/sleepmode-prefs
          cp -R "$PREFS_BUNDLE" /tmp/sleepmode-prefs/SleepModePrefs.bundle

      - name: Build package with original 1.1.0 core
        run: |
          set -e
          export THEOS="$HOME/theos"
          make -C SleepMode clean || true
          make -C SleepMode package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          MAIN_DEB="$(find SleepMode/packages -maxdepth 1 -name '*.deb' -print | head -n 1)"
          test -n "$MAIN_DEB"
          echo "MAIN_DEB=$MAIN_DEB" >> "$GITHUB_ENV"

      - name: Merge Settings bundle and verify package
        run: |
          set -e
          rm -rf /tmp/sleepmode-final /tmp/sleepmode-check
          mkdir -p /tmp/sleepmode-final
          dpkg-deb -x "$MAIN_DEB" /tmp/sleepmode-final
          mkdir -p /tmp/sleepmode-final/DEBIAN
          dpkg-deb -e "$MAIN_DEB" /tmp/sleepmode-final/DEBIAN
          mkdir -p /tmp/sleepmode-final/Library/PreferenceBundles
          mkdir -p /tmp/sleepmode-final/Library/PreferenceLoader/Preferences
          cp -R /tmp/sleepmode-prefs/SleepModePrefs.bundle /tmp/sleepmode-final/Library/PreferenceBundles/
          cp SleepModePrefs/entry.plist /tmp/sleepmode-final/Library/PreferenceLoader/Preferences/SleepModePrefs.plist
          rm -f "$MAIN_DEB"
          dpkg-deb --build /tmp/sleepmode-final "$MAIN_DEB"

          mkdir -p /tmp/sleepmode-check
          dpkg-deb -x "$MAIN_DEB" /tmp/sleepmode-check
          DYL=/tmp/sleepmode-check/Library/MobileSubstrate/DynamicLibraries
          PREF=/tmp/sleepmode-check/Library/PreferenceBundles/SleepModePrefs.bundle
          test -f "$DYL/SleepMode.dylib"
          test -f "$DYL/SleepMode.plist"
          test -f "$DYL/SleepModeSettingsBridge.dylib"
          test -f "$DYL/SleepModeSettingsBridge.plist"
          test -f "$PREF/SleepModePrefs"
          test -f "$PREF/Root.plist"
          test -f "$PREF/icon.png"
          test -f /tmp/sleepmode-check/Library/PreferenceLoader/Preferences/SleepModePrefs.plist
          plutil -lint "$PREF/Root.plist"
          if find /tmp/sleepmode-check -type f | grep -Ei 'SleepModeModule|SleepModeProvider|SleepControlCenter'; then
            echo "Unexpected Control Center payload"; exit 1
          fi
          echo "Package verification passed"
          find /tmp/sleepmode-check -type f -print | sort

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SleepMode-RootHide-${{ github.sha }}
          path: SleepMode/packages/*.deb
          if-no-files-found: error
          retention-days: 30
