name: Build SleepMode RootHide

on:
  push:
    branches:
      - feature/core

  pull_request:
    branches:
      - feature/core

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -e

          XCODE_PATH="/Applications/Xcode_26.6.app"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "ERROR: Xcode 26.6 not found"
            ls -la /Applications/Xcode*.app || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          xcodebuild -version

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          brew install ldid xz perl dpkg

      - name: Install RootHide Theos
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          rm -rf "$THEOS"

          git clone \
            --depth=1 \
            https://github.com/roothide/theos.git \
            "$THEOS"

          test -d "$THEOS"

          test -f "$THEOS/bin/update-theos"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo "========================================"
          echo "THEOS:"
          echo "$THEOS"
          echo "========================================"

          "$THEOS/bin/update-theos"

      - name: Install dm.pl and SDK
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          rm -rf /tmp/dm.pl
          rm -rf /tmp/theos-sdks

          git clone \
            --depth=1 \
            https://github.com/theos/dm.pl.git \
            /tmp/dm.pl

          test -f /tmp/dm.pl/dm.pl

          cp \
            /tmp/dm.pl/dm.pl \
            "$THEOS/bin/dm.pl"

          chmod +x "$THEOS/bin/dm.pl"

          echo "$THEOS/bin" >> "$GITHUB_PATH"

          git clone \
            --depth=1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          if [ ! -d "/tmp/theos-sdks/iPhoneOS16.5.sdk" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found"

            echo "Available SDKs:"
            find /tmp/theos-sdks -maxdepth 1 -type d -print

            exit 1
          fi

          mkdir -p "$THEOS/sdks"

          rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk"

          cp -R \
            /tmp/theos-sdks/iPhoneOS16.5.sdk \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "========================================"
          echo "Installed SDK:"
          echo "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "========================================"

      - name: Debug project structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          echo "Repository root:"
          pwd

          echo ""
          echo "Top-level:"
          find . -maxdepth 2 -print | sort

          echo ""
          echo "SleepMode:"
          find SleepMode -maxdepth 3 -print | sort || true

          echo ""
          echo "SleepModePrefs:"
          find SleepModePrefs -maxdepth 3 -print | sort || true

      - name: Validate sources and plists
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Validating project"
          echo "========================================"

          check_file() {
            FILE="$1"

            if [ -f "$FILE" ]; then
              echo "[OK]   $FILE"
            else
              echo "[MISS] $FILE"
              return 1
            fi
          }

          check_not_file() {
            FILE="$1"

            if [ ! -f "$FILE" ]; then
              echo "[OK]   absent: $FILE"
            else
              echo "[ERROR] unexpected file exists: $FILE"
              return 1
            fi
          }

          echo ""
          echo "Core files:"
          check_file "SleepMode/prebuilt/SleepMode.dylib"
          check_file "SleepMode/prebuilt/SleepMode.plist"
          check_file "SleepMode/Tweak.xm"
          check_file "SleepMode/SleepModeSettingsBridge.plist"

          echo ""
          echo "Removed source core:"
          check_not_file "SleepMode/SleepManager.m"

          echo ""
          echo "Preferences:"
          check_file "SleepModePrefs/SleepModePrefs.m"
          check_file "SleepModePrefs/SleepModeTimeoutController.m"
          check_file "SleepModePrefs/Resources/Root.plist"
          check_file "SleepModePrefs/Resources/icon.png"
          check_file "SleepModePrefs/entry.plist"

          echo ""
          echo "Validating plist files:"

          plutil -lint \
            "SleepMode/prebuilt/SleepMode.plist"

          plutil -lint \
            "SleepMode/SleepModeSettingsBridge.plist"

          plutil -lint \
            "SleepModePrefs/Resources/Root.plist"

          plutil -lint \
            "SleepModePrefs/entry.plist"

          echo ""
          echo "========================================"
          echo "Source validation passed"
          echo "========================================"

      - name: Build Preferences bundle
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          echo "========================================"
          echo "Building SleepModePrefs"
          echo "========================================"

          make \
            -C SleepModePrefs \
            clean

          make \
            -C SleepModePrefs \
            all \
            THEOS_PACKAGE_SCHEME=roothide

          PREFS_BUNDLE="$(
            find SleepModePrefs \
              -type d \
              -name "SleepModePrefs.bundle" \
              -print \
              | head -n 1
          )"

          if [ -z "$PREFS_BUNDLE" ]; then
            echo "ERROR: SleepModePrefs.bundle not found"

            find SleepModePrefs \
              -type d \
              -print

            exit 1
          fi

          test -f "$PREFS_BUNDLE/SleepModePrefs"
          test -f "$PREFS_BUNDLE/Root.plist"
          test -f "$PREFS_BUNDLE/icon.png"

          rm -rf /tmp/sleepmode-prefs

          mkdir -p /tmp/sleepmode-prefs

          cp -R \
            "$PREFS_BUNDLE" \
            /tmp/sleepmode-prefs/SleepModePrefs.bundle

          echo "========================================"
          echo "Preferences bundle built"
          echo "========================================"

          find \
            /tmp/sleepmode-prefs/SleepModePrefs.bundle \
            -type f \
            -print \
            | sort

      - name: Build SleepMode package
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          echo "========================================"
          echo "Building SleepMode"
          echo "========================================"

          make \
            -C SleepMode \
            clean || true

          make \
            -C SleepMode \
            package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

          MAIN_DEB="$(
            find SleepMode/packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN_DEB" ]; then
            echo "ERROR: No .deb generated"

            find SleepMode \
              -maxdepth 3 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo "MAIN_DEB=$MAIN_DEB" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Built package:"
          ls -lh "$MAIN_DEB"
          echo "========================================"

      - name: Merge Settings bundle and verify package
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          rm -rf \
            /tmp/sleepmode-final \
            /tmp/sleepmode-check

          mkdir -p /tmp/sleepmode-final

          dpkg-deb \
            -x \
            "$MAIN_DEB" \
            /tmp/sleepmode-final

          mkdir -p \
            /tmp/sleepmode-final/DEBIAN

          dpkg-deb \
            -e \
            "$MAIN_DEB" \
            /tmp/sleepmode-final/DEBIAN

          mkdir -p \
            /tmp/sleepmode-final/Library/PreferenceBundles

          mkdir -p \
            /tmp/sleepmode-final/Library/PreferenceLoader/Preferences

          cp -R \
            /tmp/sleepmode-prefs/SleepModePrefs.bundle \
            /tmp/sleepmode-final/Library/PreferenceBundles/

          cp \
            SleepModePrefs/entry.plist \
            /tmp/sleepmode-final/Library/PreferenceLoader/Preferences/SleepModePrefs.plist

          rm -f "$MAIN_DEB"

          dpkg-deb \
            --build \
            /tmp/sleepmode-final \
            "$MAIN_DEB"

          test -f "$MAIN_DEB"

          mkdir -p /tmp/sleepmode-check

          dpkg-deb \
            -x \
            "$MAIN_DEB" \
            /tmp/sleepmode-check

          DYL="/tmp/sleepmode-check/Library/MobileSubstrate/DynamicLibraries"
          PREF="/tmp/sleepmode-check/Library/PreferenceBundles/SleepModePrefs.bundle"

          echo "========================================"
          echo "Checking required files"
          echo "========================================"

          test -f "$DYL/SleepMode.dylib"
          test -f "$DYL/SleepMode.plist"

          test -f "$DYL/SleepModeSettingsBridge.dylib"
          test -f "$DYL/SleepModeSettingsBridge.plist"

          test -f "$PREF/SleepModePrefs"
          test -f "$PREF/Root.plist"
          test -f "$PREF/icon.png"

          test -f \
            "/tmp/sleepmode-check/Library/PreferenceLoader/Preferences/SleepModePrefs.plist"

          plutil -lint \
            "$PREF/Root.plist"

          plutil -lint \
            "$DYL/SleepMode.plist"

          plutil -lint \
            "$DYL/SleepModeSettingsBridge.plist"

          echo "========================================"
          echo "Checking Control Center"
          echo "========================================"

          if find /tmp/sleepmode-check \
              -type f \
              | grep -Ei \
                'SleepModeModule|SleepModeProvider|SleepControlCenter'; then

            echo "ERROR: Control Center payload detected"
            exit 1
          fi

          echo "No Control Center payload found."

          echo "========================================"
          echo "PACKAGE VERIFICATION PASSED"
          echo "========================================"

          find \
            /tmp/sleepmode-check \
            -type f \
            -print \
            | sort

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SleepMode-RootHide-${{ github.sha }}
          path: SleepMode/packages/*.deb
          if-no-files-found: error
          retention-days: 30
