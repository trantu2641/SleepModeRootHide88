name: Build SleepMode RootHide

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop
      - feature/core


jobs:

  build:
    runs-on: macos-26

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # XCODE
      # =====================================================

      - name: Select Xcode
        run: |
          sudo xcode-select \
            -s /Applications/Xcode_26.6.app/Contents/Developer

          echo "===== XCODE ====="

          xcodebuild -version


      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          brew update

          brew install \
            ldid \
            xz \
            perl


      # =====================================================
      # THEOS
      # =====================================================

      - name: Install RootHide Theos
        run: |
          rm -rf "$HOME/theos"

          git clone --depth=1 \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"


      # =====================================================
      # dm.pl
      # =====================================================

      - name: Install dm.pl
        run: |
          export THEOS="$HOME/theos"

          rm -rf /tmp/dm.pl

          git clone --depth=1 \
            https://github.com/theos/dm.pl.git \
            /tmp/dm.pl

          mkdir -p "$THEOS/bin"

          cp \
            /tmp/dm.pl/dm.pl \
            "$THEOS/bin/dm.pl"

          chmod +x \
            "$THEOS/bin/dm.pl"

          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo "===== dm.pl ====="

          "$THEOS/bin/dm.pl" --help


      # =====================================================
      # SDK
      # =====================================================

      - name: Install iPhoneOS SDK
        run: |
          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/sdks"

          rm -rf /tmp/theos-sdks

          git clone --depth=1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          if [ ! -d \
            "/tmp/theos-sdks/iPhoneOS16.5.sdk" ]; then

            echo "ERROR:"
            echo "iPhoneOS16.5.sdk not found"

            echo ""
            echo "Available SDKs:"

            find /tmp/theos-sdks \
              -maxdepth 1 \
              -type d \
              -name "iPhoneOS*.sdk" \
              -print

            exit 1
          fi

          cp -R \
            "/tmp/theos-sdks/iPhoneOS16.5.sdk" \
            "$THEOS/sdks/"


      # =====================================================
      # VERIFY
      # =====================================================

      - name: Verify build environment
        run: |
          export THEOS="$HOME/theos"

          echo "================================"
          echo "THEOS"
          echo "================================"

          echo "$THEOS"

          echo ""
          echo "================================"
          echo "dm.pl"
          echo "================================"

          which dm.pl

          ls -lh \
            "$THEOS/bin/dm.pl"

          echo ""
          echo "================================"
          echo "SDK"
          echo "================================"

          ls -ld \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo ""
          echo "================================"
          echo "ldid"
          echo "================================"

          which ldid


      # =====================================================
      # BUILD
      # =====================================================

      - name: Build SleepMode
        working-directory: SleepMode
        run: |
          export THEOS="$HOME/theos"

          echo "================================"
          echo "CLEAN"
          echo "================================"

          make clean

          echo ""
          echo "================================"
          echo "PACKAGE"
          echo "================================"

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide


      # =====================================================
      # SHOW RESULT
      # =====================================================

      - name: Show build result
        run: |
          echo "================================"
          echo "BUILD RESULT"
          echo "================================"

          find . \
            -type f \
            -name "*.deb" \
            -print


      # =====================================================
      # UPLOAD
      # =====================================================

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SleepMode-RootHide
          path: |
            SleepMode/packages/*.deb
