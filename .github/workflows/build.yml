name: Build SleepMode RootHide

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop
      - feature/core

jobs:

  build:
    runs-on: macos-26

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Select Xcode
        run: |
          sudo xcode-select \
            -s /Applications/Xcode_26.6.app/Contents/Developer

          xcodebuild -version


      - name: Install dependencies
        run: |
          brew update
          brew install ldid xz perl


      - name: Install RootHide Theos
        run: |
          rm -rf "$HOME/theos"

          git clone --depth=1 \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"


      - name: Install Theos SDK
        run: |
          mkdir -p "$HOME/theos/sdks"

          rm -rf /tmp/theos-sdks

          git clone --depth=1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          if [ ! -d "/tmp/theos-sdks/iPhoneOS16.5.sdk" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found"
            echo "Available SDKs:"
            find /tmp/theos-sdks \
              -maxdepth 1 \
              -type d \
              -name "iPhoneOS*.sdk" \
              -print
            exit 1
          fi

          cp -R \
            /tmp/theos-sdks/iPhoneOS16.5.sdk \
            "$HOME/theos/sdks/"


      - name: Verify Theos tools
        run: |
          export THEOS="$HOME/theos"

          echo "===== THEOS ====="
          echo "$THEOS"

          echo "===== dm.pl ====="

          find "$THEOS" \
            -name "dm.pl" \
            -type f \
            -print

          echo "===== ldid ====="
          which ldid
          ldid -h >/dev/null 2>&1 || true


      - name: Add Theos bin to PATH
        run: |
          export THEOS="$HOME/theos"

          if [ -d "$THEOS/bin" ]; then
            echo "$THEOS/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "$THEOS/bin/dm.pl" ]; then
            echo "$THEOS/bin/dm.pl" >> "$GITHUB_PATH"
          fi


      - name: Check dm.pl
        run: |
          export THEOS="$HOME/theos"

          DM_PATH="$(find "$THEOS" -name "dm.pl" -type f | head -n 1)"

          if [ -z "$DM_PATH" ]; then
            echo "ERROR: dm.pl does not exist in Theos"
            exit 1
          fi

          echo "Found dm.pl:"
          echo "$DM_PATH"

          chmod +x "$DM_PATH"


      - name: Build SleepMode
        working-directory: SleepMode
        run: |
          export THEOS="$HOME/theos"

          echo "===== BUILD ====="

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide


      - name: Show package
        run: |
          echo "===== BUILD RESULT ====="

          find . \
            -type f \
            -name "*.deb" \
            -print


      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SleepMode-RootHide
          path: |
            SleepMode/packages/*.deb
