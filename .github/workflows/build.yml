name: Build SleepMode RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. KIỂM TRA / SỬA PREFERENCE FILES
      # =====================================================

      - name: Prepare SleepMode Preferences
        run: |
          set -e

          echo "================================"
          echo "PREPARE SLEEPMODE PREFS"
          echo "================================"

          test -f SleepModePrefs/SleepModePrefs.m
          test -f SleepModePrefs/Root.plist
          test -f SleepModePrefs/Resources/icon.png

          echo ""
          echo "Fixing PreferenceLoader entry.plist..."

          cat > SleepModePrefs/entry.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>entry</key>
              <dict>
                  <key>bundle</key>
                  <string>SleepModePrefs</string>

                  <key>cell</key>
                  <string>PSLinkCell</string>

                  <key>detail</key>
                  <string>SleepModePrefsListController</string>

                  <key>isController</key>
                  <true/>

                  <key>label</key>
                  <string>SleepMode</string>

                  <key>icon</key>
                  <string>icon.png</string>
              </dict>
          </dict>
          </plist>
          EOF

          echo ""
          echo "===== entry.plist ====="
          cat SleepModePrefs/entry.plist

          echo ""
          echo "===== PLIST CHECK ====="

          plutil -lint SleepModePrefs/entry.plist
          plutil -lint SleepModePrefs/Root.plist

          echo ""
          echo "SleepMode Preferences: OK"


      # =====================================================
      # 3. KIỂM TRA CONTROL CENTER ĐÃ BỊ LOẠI KHỎI BUILD
      # =====================================================

      - name: Check Control Center Removal
        run: |
          set -e

          echo "================================"
          echo "CONTROL CENTER CHECK"
          echo "================================"

          if grep -R \
            "SleepModeModule\|SleepModeProvider\|SleepControlCenter" \
            SleepMode/Makefile \
            SleepModePrefs/Makefile \
            2>/dev/null; then

            echo ""
            echo "ERROR: Control Center files are still referenced by build."
            exit 1

          else

            echo "Control Center: NOT INCLUDED IN BUILD"

          fi


      # =====================================================
      # 4. CHỌN XCODE
      # =====================================================

      - name: Select Xcode 26.6
        run: |
          set -e

          sudo xcode-select \
            -s /Applications/Xcode_26.6.app/Contents/Developer

          echo "================================"
          echo "XCODE VERSION"
          echo "================================"

          xcodebuild -version

          echo ""
          echo "================================"
          echo "XCODE PATH"
          echo "================================"

          xcode-select -p


      # =====================================================
      # 5. CÀI DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          set -e

          brew update

          brew install \
            ldid \
            xz \
            perl

          echo "================================"
          echo "DEPENDENCIES"
          echo "================================"

          echo "ldid:"
          which ldid

          echo ""
          echo "perl:"
          which perl

          echo ""
          echo "xz:"
          which xz


      # =====================================================
      # 6. CÀI ROOT HIDE THEOS
      # =====================================================

      - name: Install RootHide Theos
        run: |
          set -e

          rm -rf "$HOME/theos"

          git clone --depth=1 \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

          echo "================================"
          echo "THEOS INSTALLED"
          echo "================================"

          echo "THEOS=$HOME/theos"

          ls -la "$HOME/theos"


      # =====================================================
      # 7. BOOTSTRAP THEOS
      # =====================================================

      - name: Bootstrap Theos
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "BOOTSTRAP THEOS"
          echo "================================"

          chmod +x \
            "$THEOS/bin/update-theos"

          "$THEOS/bin/update-theos"

          echo ""
          echo "================================"
          echo "VENDOR CHECK"
          echo "================================"

          if [ ! -d "$THEOS/vendor/include" ]; then
            echo "ERROR: vendor/include missing"
            exit 1
          fi

          if [ ! -d "$THEOS/vendor/lib" ]; then
            echo "ERROR: vendor/lib missing"
            exit 1
          fi

          echo "vendor/include: OK"
          echo "vendor/lib: OK"


      # =====================================================
      # 8. CÀI dm.pl
      # =====================================================

      - name: Install dm.pl
        run: |
          set -e

          export THEOS="$HOME/theos"

          rm -rf /tmp/dm.pl

          git clone --depth=1 \
            https://github.com/theos/dm.pl.git \
            /tmp/dm.pl

          mkdir -p "$THEOS/bin"

          cp \
            /tmp/dm.pl/dm.pl \
            "$THEOS/bin/dm.pl"

          chmod +x \
            "$THEOS/bin/dm.pl"

          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo "================================"
          echo "dm.pl INSTALLED"
          echo "================================"

          ls -lh \
            "$THEOS/bin/dm.pl"


      # =====================================================
      # 9. CÀI IPHONEOS 16.5 SDK
      # =====================================================

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e

          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/sdks"

          rm -rf /tmp/theos-sdks

          git clone --depth=1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          echo "================================"
          echo "AVAILABLE IPHONEOS SDKS"
          echo "================================"

          find /tmp/theos-sdks \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print

          if [ ! -d \
            "/tmp/theos-sdks/iPhoneOS16.5.sdk" ]; then

            echo ""
            echo "ERROR:"
            echo "iPhoneOS16.5.sdk was not found."

            exit 1
          fi

          cp -R \
            "/tmp/theos-sdks/iPhoneOS16.5.sdk" \
            "$THEOS/sdks/"

          echo ""
          echo "================================"
          echo "SDK INSTALLED"
          echo "================================"

          ls -ld \
            "$THEOS/sdks/iPhoneOS16.5.sdk"


      # =====================================================
      # 10. KIỂM TRA MÔI TRƯỜNG BUILD
      # =====================================================

      - name: Verify build environment
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "THEOS"
          echo "================================"

          echo "$THEOS"

          echo ""
          echo "================================"
          echo "THEOS VENDOR"
          echo "================================"

          if [ ! -d "$THEOS/vendor/include" ]; then
            echo "ERROR: vendor/include not found"
            exit 1
          fi

          if [ ! -d "$THEOS/vendor/lib" ]; then
            echo "ERROR: vendor/lib not found"
            exit 1
          fi

          echo "vendor/include: OK"
          echo "vendor/lib: OK"

          echo ""
          echo "================================"
          echo "dm.pl"
          echo "================================"

          if [ ! -f "$THEOS/bin/dm.pl" ]; then
            echo "ERROR: dm.pl not found"
            exit 1
          fi

          ls -lh "$THEOS/bin/dm.pl"

          echo ""
          echo "================================"
          echo "LDID"
          echo "================================"

          if ! command -v ldid >/dev/null 2>&1; then
            echo "ERROR: ldid not found"
            exit 1
          fi

          which ldid

          echo ""
          echo "================================"
          echo "SDK"
          echo "================================"

          if [ ! -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then

            echo "ERROR: SDK not found"
            exit 1
          fi

          ls -ld \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo ""
          echo "================================"
          echo "THEOS COMMON.MK"
          echo "================================"

          if [ -f "$THEOS/makefiles/common.mk" ]; then
            echo "common.mk: OK"
          else
            echo "ERROR: common.mk not found"
            exit 1
          fi


      # =====================================================
      # 11. KIỂM TRA PROJECT
      # =====================================================

      - name: Check SleepMode project
        run: |
          set -e

          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          find SleepMode \
            -maxdepth 2 \
            -type f \
            -print

          echo ""
          echo "================================"
          echo "PREFERENCE FILES"
          echo "================================"

          find SleepModePrefs \
            -maxdepth 3 \
            -type f \
            -print

          echo ""
          echo "================================"
          echo "REQUIRED FILES"
          echo "================================"

          REQUIRED_FILES="
          SleepMode/Makefile
          SleepMode/SleepMode.plist
          SleepMode/Tweak.xm
          SleepMode/SleepManager.h
          SleepMode/SleepManager.m

          SleepModePrefs/Makefile
          SleepModePrefs/SleepModePrefs.m
          SleepModePrefs/Root.plist
          SleepModePrefs/entry.plist
          SleepModePrefs/Resources/icon.png
          "

          for FILE in $REQUIRED_FILES
          do

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing file:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"

          done

          echo ""
          echo "================================"
          echo "PLIST VALIDATION"
          echo "================================"

          plutil -lint \
            SleepMode/SleepMode.plist

          plutil -lint \
            SleepModePrefs/Root.plist

          plutil -lint \
            SleepModePrefs/entry.plist

          echo ""
          echo "All required project files: OK"


      # =====================================================
      # 12. KIỂM TRA PREFS CONFIG
      # =====================================================

      - name: Check SleepMode Settings Configuration
        run: |
          set -e

          echo "================================"
          echo "SLEEPMODE SETTINGS CONFIG"
          echo "================================"

          echo ""
          echo "entry.plist:"
          cat SleepModePrefs/entry.plist

          echo ""
          echo "Root.plist:"
          cat SleepModePrefs/Root.plist

          echo ""
          echo "Checking required identifiers..."

          grep -q \
            "SleepModePrefsListController" \
            SleepModePrefs/entry.plist

          grep -q \
            "SleepModeEnabled" \
            SleepModePrefs/Root.plist

          grep -q \
            "SleepModeTimeout" \
            SleepModePrefs/Root.plist

          grep -q \
            "com.trantu.sleepmode.settingsChanged" \
            SleepModePrefs/Root.plist

          echo ""
          echo "Settings configuration: OK"


      # =====================================================
      # 13. BUILD
      # =====================================================

      - name: Build SleepMode
        working-directory: SleepMode
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "TARGET"
          echo "================================"

          grep "^TARGET" Makefile || true

          echo ""
          echo "================================"
          echo "ARCHS"
          echo "================================"

          grep "^ARCHS" Makefile || true

          echo ""
          echo "================================"
          echo "PACKAGE SCHEME"
          echo "================================"

          grep "THEOS_PACKAGE_SCHEME" Makefile || true

          echo ""
          echo "================================"
          echo "CLEAN"
          echo "================================"

          make clean

          echo ""
          echo "================================"
          echo "BUILD PACKAGE"
          echo "================================"

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

          echo ""
          echo "================================"
          echo "BUILD FINISHED"
          echo "================================"

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print


      # =====================================================
      # 14. KIỂM TRA DEB
      # =====================================================

      - name: Verify DEB
        run: |
          set -e

          echo "================================"
          echo "DEB FILES"
          echo "================================"

          find SleepMode/packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

          DEB_COUNT=$(
            find SleepMode/packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              | wc -l
          )

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No .deb package generated."
            exit 1
          fi

          DEB=$(
            find SleepMode/packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              | head -n 1
          )

          echo ""
          echo "================================"
          echo "SELECTED DEB"
          echo "================================"

          echo "$DEB"


          # -------------------------------------------------
          # Extract package
          # -------------------------------------------------

          rm -rf /tmp/sleepmode-deb
          mkdir -p /tmp/sleepmode-deb

          dpkg-deb -x \
            "$DEB" \
            /tmp/sleepmode-deb


          # -------------------------------------------------
          # Show package contents
          # -------------------------------------------------

          echo ""
          echo "================================"
          echo "PACKAGE CONTENT"
          echo "================================"

          find /tmp/sleepmode-deb \
            -type f \
            | sort


          # -------------------------------------------------
          # CHECK TWEAK
          # -------------------------------------------------

          echo ""
          echo "================================"
          echo "CHECK TWEAK"
          echo "================================"

          if [ ! -f \
            "/tmp/sleepmode-deb/Library/MobileSubstrate/DynamicLibraries/SleepMode.dylib" ]; then

            echo "ERROR: SleepMode.dylib missing"
            exit 1

          fi

          echo "SleepMode.dylib: OK"


          # -------------------------------------------------
          # CHECK SETTINGS BUNDLE
          # -------------------------------------------------

          echo ""
          echo "================================"
          echo "CHECK SETTINGS BUNDLE"
          echo "================================"

          PREF_BUNDLE="/tmp/sleepmode-deb/Library/PreferenceBundles/SleepModePrefs.bundle"

          PREF_ENTRY="/tmp/sleepmode-deb/Library/PreferenceLoader/Preferences/SleepModePrefs.plist"

          if [ ! -d "$PREF_BUNDLE" ]; then
            echo "ERROR: SleepModePrefs.bundle missing"
            exit 1
          fi

          if [ ! -f "$PREF_ENTRY" ]; then
            echo "ERROR: SleepModePrefs.plist missing"
            exit 1
          fi

          echo "SleepModePrefs.bundle: OK"
          echo "PreferenceLoader entry: OK"


          # -------------------------------------------------
          # CHECK ROOT.PLIST
          # -------------------------------------------------

          echo ""
          echo "================================"
          echo "CHECK ROOT.PLIST"
          echo "================================"

          if [ ! -f \
            "$PREF_BUNDLE/Root.plist" ]; then

            echo "ERROR: Root.plist missing"
            exit 1

          fi

          plutil -lint \
            "$PREF_BUNDLE/Root.plist"

          echo "Root.plist: OK"


          # -------------------------------------------------
          # CHECK ENTRY PLIST
          # -------------------------------------------------

          echo ""
          echo "================================"
          echo "CHECK PREFERENCELOADER"
          echo "================================"

          plutil -lint \
            "$PREF_ENTRY"

          echo ""
          echo "entry.plist:"
          cat "$PREF_ENTRY"


          # -------------------------------------------------
          # CHECK ICON
          # -------------------------------------------------

          echo ""
          echo "================================"
          echo "CHECK ICON"
          echo "================================"

          if [ ! -f \
            "$PREF_BUNDLE/icon.png" ]; then

            echo "ERROR: Preference icon missing"
            exit 1

          fi

          echo "icon.png: OK"


          # -------------------------------------------------
          # CHECK CONTROL CENTER ABSENCE
          # -------------------------------------------------

          echo ""
          echo "================================"
          echo "CHECK CONTROL CENTER"
          echo "================================"

          if find /tmp/sleepmode-deb \
            -type f \
            | grep -Ei \
              "SleepModeModule|SleepModeProvider|SleepControlCenter"; then

            echo ""
            echo "ERROR: Control Center files found in package."
            exit 1

          fi

          echo "Control Center: NOT PACKAGED"


          # -------------------------------------------------
          # FINAL RESULT
          # -------------------------------------------------

          echo ""
          echo "================================"
          echo "SLEEPMODE PACKAGE: OK"
          echo "================================"

          echo "DEB:"
          echo "$DEB"

          echo ""
          echo "Settings:"
          echo "  - PreferenceLoader: OK"
          echo "  - PreferenceBundle: OK"
          echo "  - Root.plist: OK"
          echo "  - entry.plist: OK"
          echo "  - icon: OK"
          echo "  - Control Center: removed"

          echo ""
          echo "BUILD SUCCESS"


      # =====================================================
      # 15. HIỂN THỊ PACKAGE
      # =====================================================

      - name: Show package information
        run: |
          echo "================================"
          echo "PACKAGE INFORMATION"
          echo "================================"

          find SleepMode/packages \
            -type f \
            -name "*.deb" \
            -exec ls -lh {} \;

          echo ""
          echo "================================"
          echo "DPKG INFORMATION"
          echo "================================"

          for DEB in SleepMode/packages/*.deb
          do
            dpkg-deb -I "$DEB"
          done


      # =====================================================
      # 16. UPLOAD DEB
      # =====================================================

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SleepMode-RootHide
          path: |
            SleepMode/packages/*.deb
