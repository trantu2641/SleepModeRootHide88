name: Build SleepMode RootHide

on:
  push:
    branches:
      - feature/core

  pull_request:
    branches:
      - feature/core

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. CHECK WORKSPACE
      # =====================================================

      - name: Check project
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          echo "================================"
          echo "WORKSPACE"
          echo "================================"

          pwd
          ls -la

          test -d SleepMode
          test -d SleepModePrefs

          echo ""
          echo "SleepMode: OK"
          echo "SleepModePrefs: OK"


      # =====================================================
      # 3. CHECK REQUIRED FILES
      # =====================================================

      - name: Check required files
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          FILES="
          SleepMode/Makefile
          SleepMode/SleepMode.plist
          SleepMode/Tweak.xm
          SleepMode/SleepManager.h
          SleepMode/SleepManager.m
          SleepModePrefs/Makefile
          SleepModePrefs/SleepModePrefs.m
          SleepModePrefs/Resources/Root.plist
          SleepModePrefs/Resources/icon.png
          SleepModePrefs/entry.plist
          "

          for FILE in $FILES
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done


      # =====================================================
      # 4. VALIDATE PLIST
      # =====================================================

      - name: Validate plist
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          plutil -lint SleepMode/SleepMode.plist
          plutil -lint SleepModePrefs/Resources/Root.plist
          plutil -lint SleepModePrefs/entry.plist

          echo "Plist validation: OK"


      # =====================================================
      # 5. SHOW PROJECT
      # =====================================================

      - name: Show project files
        working-directory: ${{ github.workspace }}
        run: |
          echo "================================"
          echo "SLEEPMODE"
          echo "================================"

          find SleepMode \
            -maxdepth 2 \
            -type f \
            -print

          echo ""
          echo "================================"
          echo "SLEEPMODE PREFS"
          echo "================================"

          find SleepModePrefs \
            -maxdepth 3 \
            -type f \
            -print


      # =====================================================
      # 6. XCODE
      # =====================================================

      - name: Select Xcode
        run: |
          set -e

          XCODE="/Applications/Xcode_26.6.app"

          if [ ! -d "$XCODE" ]; then
            echo "ERROR: Xcode 26.6 not found"
            ls -la /Applications | grep Xcode || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE/Contents/Developer"

          echo "================================"
          echo "XCODE"
          echo "================================"

          xcodebuild -version
          xcode-select -p


      # =====================================================
      # 7. DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          set -e

          brew update

          brew install \
            ldid \
            xz \
            perl \
            dpkg

          echo ""
          echo "Dependencies: OK"


      # =====================================================
      # 8. INSTALL THEOS
      # =====================================================

      - name: Install RootHide Theos
        run: |
          set -e

          rm -rf "$HOME/theos"

          git clone \
            --depth=1 \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

          echo "Theos installed."


      # =====================================================
      # 9. BOOTSTRAP THEOS
      # =====================================================

      - name: Bootstrap Theos
        run: |
          set -e

          export THEOS="$HOME/theos"

          chmod +x "$THEOS/bin/update-theos"

          "$THEOS/bin/update-theos"

          test -d "$THEOS/vendor/include"
          test -d "$THEOS/vendor/lib"

          echo "Theos bootstrap: OK"


      # =====================================================
      # 10. INSTALL DM.PL
      # =====================================================

      - name: Install dm.pl
        run: |
          set -e

          export THEOS="$HOME/theos"

          git clone \
            --depth=1 \
            https://github.com/theos/dm.pl.git \
            /tmp/dm.pl

          cp \
            /tmp/dm.pl/dm.pl \
            "$THEOS/bin/dm.pl"

          chmod +x \
            "$THEOS/bin/dm.pl"

          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo "dm.pl: OK"


      # =====================================================
      # 11. INSTALL SDK
      # =====================================================

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e

          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/sdks"

          rm -rf /tmp/theos-sdks

          git clone \
            --depth=1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          if [ ! -d "/tmp/theos-sdks/iPhoneOS16.5.sdk" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found"
            exit 1
          fi

          cp -R \
            "/tmp/theos-sdks/iPhoneOS16.5.sdk" \
            "$THEOS/sdks/"

          echo "iPhoneOS16.5.sdk: OK"


      # =====================================================
      # 12. CLEAN
      # =====================================================

      - name: Clean previous build
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          export THEOS="$HOME/theos"

          make -C SleepModePrefs clean || true
          make -C SleepMode clean || true

          rm -rf /tmp/sleepmode-final


      # =====================================================
      # 13. BUILD PREFERENCE BUNDLE
      # =====================================================

      - name: Build SleepModePrefs
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "BUILD SLEEPMODE PREFS"
          echo "================================"

          make \
            -C SleepModePrefs \
            package \
            THEOS_PACKAGE_SCHEME=roothide

          PREFS_BUNDLE="$(
            find SleepModePrefs/.theos \
              -type d \
              -name "SleepModePrefs.bundle" \
              -print \
              2>/dev/null \
              | head -n 1
          )"

          if [ -z "$PREFS_BUNDLE" ]; then
            PREFS_BUNDLE="$(
              find SleepModePrefs \
                -type d \
                -name "SleepModePrefs.bundle" \
                -print \
                2>/dev/null \
                | head -n 1
            )"
          fi

          if [ -z "$PREFS_BUNDLE" ]; then
            echo "ERROR: SleepModePrefs.bundle not found"
            find SleepModePrefs -type d -name "*.bundle" -print
            exit 1
          fi

          echo ""
          echo "Bundle:"
          echo "$PREFS_BUNDLE"

          test -f "$PREFS_BUNDLE/Root.plist"
          test -f "$PREFS_BUNDLE/icon.png"

          plutil -lint "$PREFS_BUNDLE/Root.plist"

          echo ""
          echo "SleepModePrefs.bundle: OK"


      # =====================================================
      # 14. BUILD MAIN TWEAK
      # =====================================================

      - name: Build SleepMode
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "BUILD SLEEPMODE"
          echo "================================"

          make \
            -C SleepMode \
            package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

          MAIN_DEB="$(
            find SleepMode/packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN_DEB" ]; then
            echo "ERROR: SleepMode .deb not found"
            exit 1
          fi

          echo ""
          echo "Main package:"
          echo "$MAIN_DEB"


      # =====================================================
      # 15. MERGE PREFERENCE BUNDLE
      # =====================================================

      - name: Merge SleepModePrefs into final DEB
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          MAIN_DEB="$(
            find SleepMode/packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -print \
              | head -n 1
          )"

          PREFS_BUNDLE="$(
            find SleepModePrefs/.theos \
              -type d \
              -name "SleepModePrefs.bundle" \
              -print \
              2>/dev/null \
              | head -n 1
          )"

          if [ -z "$PREFS_BUNDLE" ]; then
            PREFS_BUNDLE="$(
              find SleepModePrefs \
                -type d \
                -name "SleepModePrefs.bundle" \
                -print \
                2>/dev/null \
                | head -n 1
            )"
          fi

          rm -rf /tmp/sleepmode-final
          mkdir -p /tmp/sleepmode-final

          dpkg-deb \
            -x "$MAIN_DEB" \
            /tmp/sleepmode-final

          dpkg-deb \
            -e "$MAIN_DEB" \
            /tmp/sleepmode-final/DEBIAN

          mkdir -p \
            /tmp/sleepmode-final/Library/PreferenceBundles

          mkdir -p \
            /tmp/sleepmode-final/Library/PreferenceLoader/Preferences

          cp -R \
            "$PREFS_BUNDLE" \
            /tmp/sleepmode-final/Library/PreferenceBundles/SleepModePrefs.bundle

          cp \
            SleepModePrefs/entry.plist \
            /tmp/sleepmode-final/Library/PreferenceLoader/Preferences/SleepModePrefs.plist

          rm -f "$MAIN_DEB"

          dpkg-deb \
            --build \
            /tmp/sleepmode-final \
            "$MAIN_DEB"

          echo ""
          echo "================================"
          echo "FINAL DEB"
          echo "================================"

          ls -lh "$MAIN_DEB"


      # =====================================================
      # 16. VERIFY FINAL DEB
      # =====================================================

      - name: Verify final package
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          DEB="$(
            find SleepMode/packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -print \
              | head -n 1
          )"

          rm -rf /tmp/sleepmode-check
          mkdir -p /tmp/sleepmode-check

          dpkg-deb \
            -x "$DEB" \
            /tmp/sleepmode-check

          echo "================================"
          echo "CHECK TWEAK"
          echo "================================"

          test -f \
            "/tmp/sleepmode-check/Library/MobileSubstrate/DynamicLibraries/SleepMode.dylib"

          echo "SleepMode.dylib: OK"

          echo ""
          echo "================================"
          echo "CHECK SETTINGS"
          echo "================================"

          PREFS="/tmp/sleepmode-check/Library/PreferenceBundles/SleepModePrefs.bundle"

          test -d "$PREFS"
          test -f "$PREFS/Root.plist"
          test -f "$PREFS/icon.png"

          test -f \
            "/tmp/sleepmode-check/Library/PreferenceLoader/Preferences/SleepModePrefs.plist"

          plutil -lint "$PREFS/Root.plist"

          echo "PreferenceBundle: OK"
          echo "Root.plist: OK"
          echo "icon.png: OK"

          echo ""
          echo "================================"
          echo "CHECK CONTROL CENTER"
          echo "================================"

          if find /tmp/sleepmode-check \
            -type f \
            | grep -Ei \
              "SleepModeModule|SleepModeProvider|SleepControlCenter"; then

            echo "ERROR: Control Center files found."
            exit 1
          fi

          echo "Control Center: removed"

          echo ""
          echo "================================"
          echo "BUILD SUCCESS"
          echo "================================"


      # =====================================================
      # 17. UPLOAD DEB
      # =====================================================

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SleepMode-RootHide-${{ github.sha }}
          path: SleepMode/packages/*.deb
          if-no-files-found: error
          retention-days: 30


      # =====================================================
      # 18. BUILD SUMMARY
      # =====================================================

      - name: Build summary
        run: |
          echo "================================"
          echo "SLEEPMODE BUILD COMPLETE"
          echo "================================"

          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""
          echo "Commit:"
          echo "${GITHUB_SHA}"

          echo ""
          echo "Artifact:"
          echo "SleepMode-RootHide-${GITHUB_SHA}"

          echo ""
          echo "Tự động build: ENABLED"
