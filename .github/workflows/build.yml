name: Build SleepMode RootHide

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop
      - feature/core

jobs:

  build:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Homebrew dependencies
        run: |
          brew update

          brew install \
            ldid \
            xz


      - name: Install RootHide Theos
        run: |
          rm -rf "$HOME/theos"

          git clone \
            --depth=1 \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"


      - name: Install iPhoneOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"

          git clone \
            --depth=1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          cp -R \
            /tmp/theos-sdks/iPhoneOS16.5.sdk \
            "$HOME/theos/sdks/"


      - name: Build
        working-directory: SleepMode
        run: |
          export THEOS="$HOME/theos"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide


      - name: Show package
        run: |
          echo "===== BUILD RESULT ====="

          find . \
            -name "*.deb" \
            -print

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SleepMode-RootHide
          path: |
            SleepMode/packages/*.deb
