name: Build SleepMode RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. PREPARE SETTINGS
      # =====================================================

      - name: Prepare SleepMode Preferences
        run: |
          set -e

          echo "================================"
          echo "PREPARE SLEEPMODE PREFS"
          echo "================================"

          test -f SleepModePrefs/SleepModePrefs.m
          test -f SleepModePrefs/Root.plist
          test -f SleepModePrefs/Resources/icon.png

          cat > SleepModePrefs/entry.plist <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
 "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>entry</key>
    <dict>
        <key>bundle</key>
        <string>SleepModePrefs</string>

        <key>cell</key>
        <string>PSLinkCell</string>

        <key>detail</key>
        <string>SleepModePrefsListController</string>

        <key>isController</key>
        <true/>

        <key>label</key>
        <string>SleepMode</string>

        <key>icon</key>
        <string>icon.png</string>
    </dict>
</dict>
</plist>
EOF

          plutil -lint SleepModePrefs/entry.plist
          plutil -lint SleepModePrefs/Root.plist

          echo "Settings preparation: OK"


      # =====================================================
      # 3. CONTROL CENTER CHECK
      # =====================================================

      - name: Check Control Center Removal
        run: |
          set -e

          echo "================================"
          echo "CONTROL CENTER CHECK"
          echo "================================"

          if grep -R \
            "SleepModeModule\|SleepModeProvider\|SleepControlCenter" \
            SleepMode/Makefile \
            SleepModePrefs/Makefile \
            2>/dev/null; then

            echo ""
            echo "ERROR:"
            echo "Control Center is still referenced."

            exit 1
          fi

          echo "Control Center references: NONE"


      # =====================================================
      # 4. XCODE
      # =====================================================

      - name: Select Xcode 26.6
        run: |
          set -e

          sudo xcode-select \
            -s /Applications/Xcode_26.6.app/Contents/Developer

          echo "================================"
          echo "XCODE"
          echo "================================"

          xcodebuild -version
          xcode-select -p


      # =====================================================
      # 5. DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          set -e

          brew update

          brew install \
            ldid \
            xz \
            perl \
            dpkg

          echo ""
          echo "================================"
          echo "DEPENDENCIES"
          echo "================================"

          command -v ldid
          command -v dpkg-deb
          command -v xz
          command -v perl


      # =====================================================
      # 6. ROOT HIDE THEOS
      # =====================================================

      - name: Install RootHide Theos
        run: |
          set -e

          rm -rf "$HOME/theos"

          git clone \
            --depth=1 \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

          echo "================================"
          echo "THEOS"
          echo "================================"

          echo "$HOME/theos"


      # =====================================================
      # 7. BOOTSTRAP THEOS
      # =====================================================

      - name: Bootstrap Theos
        run: |
          set -e

          export THEOS="$HOME/theos"

          chmod +x \
            "$THEOS/bin/update-theos"

          "$THEOS/bin/update-theos"

          test -d "$THEOS/vendor/include"
          test -d "$THEOS/vendor/lib"
          test -f "$THEOS/makefiles/common.mk"

          echo ""
          echo "Theos bootstrap: OK"


      # =====================================================
      # 8. DM.PL
      # =====================================================

      - name: Install dm.pl
        run: |
          set -e

          export THEOS="$HOME/theos"

          rm -rf /tmp/dm.pl

          git clone \
            --depth=1 \
            https://github.com/theos/dm.pl.git \
            /tmp/dm.pl

          mkdir -p "$THEOS/bin"

          cp \
            /tmp/dm.pl/dm.pl \
            "$THEOS/bin/dm.pl"

          chmod +x \
            "$THEOS/bin/dm.pl"

          echo "$THEOS/bin" >> "$GITHUB_PATH"

          test -f "$THEOS/bin/dm.pl"

          echo "dm.pl: OK"


      # =====================================================
      # 9. IPHONEOS 16.5 SDK
      # =====================================================

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e

          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/sdks"

          rm -rf /tmp/theos-sdks

          git clone \
            --depth=1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          if [ ! -d \
            "/tmp/theos-sdks/iPhoneOS16.5.sdk" ]; then

            echo ""
            echo "ERROR:"
            echo "iPhoneOS16.5.sdk not found."

            echo ""
            echo "Available SDKs:"
            find /tmp/theos-sdks \
              -maxdepth 1 \
              -type d \
              -name "iPhoneOS*.sdk" \
              -print

            exit 1
          fi

          rm -rf \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          cp -R \
            "/tmp/theos-sdks/iPhoneOS16.5.sdk" \
            "$THEOS/sdks/"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "iPhoneOS16.5.sdk: OK"


      # =====================================================
      # 10. VERIFY ENVIRONMENT
      # =====================================================

      - name: Verify build environment
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "ENVIRONMENT"
          echo "================================"

          echo "THEOS:"
          echo "$THEOS"

          echo ""
          echo "XCODE:"
          xcodebuild -version

          echo ""
          echo "LDID:"
          ldid -h 2>&1 | head -n 2 || true

          echo ""
          echo "DPKG:"
          dpkg-deb --version | head -n 2

          echo ""
          echo "SDK:"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo ""
          echo "COMMON.MK:"
          ls -lh "$THEOS/makefiles/common.mk"

          echo ""
          echo "DM.PL:"
          ls -lh "$THEOS/bin/dm.pl"


      # =====================================================
      # 11. CHECK PROJECT
      # =====================================================

      - name: Check SleepMode project
        run: |
          set -e

          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          echo ""
          echo "--- SleepMode ---"

          find SleepMode \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          echo ""
          echo "--- SleepModePrefs ---"

          find SleepModePrefs \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          echo ""
          echo "================================"
          echo "REQUIRED FILES"
          echo "================================"

          FILES="
          SleepMode/Makefile
          SleepMode/SleepMode.plist
          SleepMode/Tweak.xm
          SleepMode/SleepManager.h
          SleepMode/SleepManager.m
          SleepModePrefs/Makefile
          SleepModePrefs/SleepModePrefs.m
          SleepModePrefs/Root.plist
          SleepModePrefs/entry.plist
          SleepModePrefs/Resources/icon.png
          "

          for FILE in $FILES
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo ""
          echo "================================"
          echo "PLIST CHECK"
          echo "================================"

          plutil -lint SleepMode/SleepMode.plist
          plutil -lint SleepModePrefs/Root.plist
          plutil -lint SleepModePrefs/entry.plist

          echo ""
          echo "Project check: OK"


      # =====================================================
      # 12. CHECK SETTINGS CONFIG
      # =====================================================

      - name: Check Settings Configuration
        run: |
          set -e

          echo "================================"
          echo "SETTINGS CONFIGURATION"
          echo "================================"

          grep -q \
            "SleepModePrefsListController" \
            SleepModePrefs/entry.plist

          grep -q \
            "SleepModeEnabled" \
            SleepModePrefs/Root.plist

          grep -q \
            "SleepModeTimeout" \
            SleepModePrefs/Root.plist

          grep -q \
            "com.trantu.sleepmode.settingsChanged" \
            SleepModePrefs/Root.plist

          echo "Controller: OK"
          echo "Enabled key: OK"
          echo "Timeout key: OK"
          echo "Notification: OK"


      # =====================================================
      # 13. BUILD SETTINGS BUNDLE
      # =====================================================

      - name: Build SleepModePrefs
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "BUILD SLEEPMODE PREFS"
          echo "================================"

          rm -rf SleepModePrefs/packages
          rm -rf SleepModePrefs/obj

          make \
            -C SleepModePrefs \
            clean

          make \
            -C SleepModePrefs \
            package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

          echo ""
          echo "================================"
          echo "PREFS PACKAGE"
          echo "================================"

          find SleepModePrefs/packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

          PREF_DEB=$(
            find SleepModePrefs/packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              | head -n 1
          )

          if [ -z "$PREF_DEB" ]; then
            echo "ERROR: SleepModePrefs .deb not found"
            exit 1
          fi

          echo ""
          echo "Prefs DEB:"
          echo "$PREF_DEB"

          rm -rf /tmp/sleepmode-prefs
          mkdir -p /tmp/sleepmode-prefs

          dpkg-deb -x \
            "$PREF_DEB" \
            /tmp/sleepmode-prefs

          echo ""
          echo "================================"
          echo "EXTRACTED PREFS"
          echo "================================"

          find /tmp/sleepmode-prefs \
            -type f \
            -print \
            | sort

          test -d \
            "/tmp/sleepmode-prefs/Library/PreferenceBundles/SleepModePrefs.bundle"

          test -f \
            "/tmp/sleepmode-prefs/Library/PreferenceBundles/SleepModePrefs.bundle/Root.plist"

          test -f \
            "/tmp/sleepmode-prefs/Library/PreferenceBundles/SleepModePrefs.bundle/icon.png"

          echo ""
          echo "SleepModePrefs.bundle: OK"


      # =====================================================
      # 14. BUILD MAIN TWEAK
      # =====================================================

      - name: Build SleepMode
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "BUILD SLEEPMODE"
          echo "================================"

          rm -rf SleepMode/packages
          rm -rf SleepMode/obj

          make \
            -C SleepMode \
            clean

          make \
            -C SleepMode \
            package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

          echo ""
          echo "================================"
          echo "MAIN PACKAGE"
          echo "================================"

          find SleepMode/packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

          MAIN_DEB=$(
            find SleepMode/packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              | head -n 1
          )

          if [ -z "$MAIN_DEB" ]; then
            echo "ERROR: Main SleepMode .deb not found"
            exit 1
          fi

          echo ""
          echo "Main DEB:"
          echo "$MAIN_DEB"


      # =====================================================
      # 15. INJECT SETTINGS INTO MAIN DEB
      # =====================================================

      - name: Inject SleepMode Settings into DEB
        run: |
          set -e

          echo "================================"
          echo "INJECT SETTINGS INTO MAIN DEB"
          echo "================================"

          MAIN_DEB=$(
            find SleepMode/packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              | head -n 1
          )

          if [ -z "$MAIN_DEB" ]; then
            echo "ERROR: Main DEB not found"
            exit 1
          fi

          rm -rf /tmp/sleepmode-main
          rm -rf /tmp/sleepmode-control

          mkdir -p /tmp/sleepmode-main
          mkdir -p /tmp/sleepmode-control

          echo ""
          echo "Extracting main DEB..."

          dpkg-deb -x \
            "$MAIN_DEB" \
            /tmp/sleepmode-main

          dpkg-deb -e \
            "$MAIN_DEB" \
            /tmp/sleepmode-control

          echo ""
          echo "Copying PreferenceBundle..."

          mkdir -p \
            /tmp/sleepmode-main/Library/PreferenceBundles

          cp -R \
            /tmp/sleepmode-prefs/Library/PreferenceBundles/SleepModePrefs.bundle \
            /tmp/sleepmode-main/Library/PreferenceBundles/

          echo ""
          echo "Copying PreferenceLoader entry..."

          mkdir -p \
            /tmp/sleepmode-main/Library/PreferenceLoader/Preferences

          cp \
            SleepModePrefs/entry.plist \
            /tmp/sleepmode-main/Library/PreferenceLoader/Preferences/SleepModePrefs.plist

          echo ""
          echo "================================"
          echo "VERIFY INJECTED FILES"
          echo "================================"

          test -d \
            /tmp/sleepmode-main/Library/PreferenceBundles/SleepModePrefs.bundle

          test -f \
            /tmp/sleepmode-main/Library/PreferenceBundles/SleepModePrefs.bundle/Root.plist

          test -f \
            /tmp/sleepmode-main/Library/PreferenceBundles/SleepModePrefs.bundle/icon.png

          test -f \
            /tmp/sleepmode-main/Library/PreferenceLoader/Preferences/SleepModePrefs.plist

          echo "PreferenceBundle: OK"
          echo "PreferenceLoader: OK"

          echo ""
          echo "Rebuilding final DEB..."

          rm -f "$MAIN_DEB"

          dpkg-deb \
            --build \
            /tmp/sleepmode-main \
            "$MAIN_DEB"

          echo ""
          echo "================================"
          echo "FINAL DEB CREATED"
          echo "================================"

          ls -lh "$MAIN_DEB"


      # =====================================================
      # 16. VERIFY FINAL DEB
      # =====================================================

      - name: Verify Final DEB
        run: |
          set -e

          echo "================================"
          echo "VERIFY FINAL PACKAGE"
          echo "================================"

          DEB=$(
            find SleepMode/packages \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              | head -n 1
          )

          if [ -z "$DEB" ]; then
            echo "ERROR: Final DEB not found"
            exit 1
          fi

          rm -rf /tmp/final-sleepmode
          mkdir -p /tmp/final-sleepmode

          dpkg-deb -x \
            "$DEB" \
            /tmp/final-sleepmode

          echo ""
          echo "================================"
          echo "PACKAGE CONTENT"
          echo "================================"

          find /tmp/final-sleepmode \
            -type f \
            -print \
            | sort


          # =================================================
          # TWEAK
          # =================================================

          echo ""
          echo "================================"
          echo "CHECK TWEAK"
          echo "================================"

          test -f \
            "/tmp/final-sleepmode/Library/MobileSubstrate/DynamicLibraries/SleepMode.dylib"

          echo "SleepMode.dylib: OK"


          # =================================================
          # SETTINGS BUNDLE
          # =================================================

          echo ""
          echo "================================"
          echo "CHECK SETTINGS BUNDLE"
          echo "================================"

          PREF_BUNDLE="/tmp/final-sleepmode/Library/PreferenceBundles/SleepModePrefs.bundle"

          PREF_ENTRY="/tmp/final-sleepmode/Library/PreferenceLoader/Preferences/SleepModePrefs.plist"

          test -d "$PREF_BUNDLE"
          test -f "$PREF_BUNDLE/Root.plist"
          test -f "$PREF_BUNDLE/icon.png"
          test -f "$PREF_ENTRY"

          echo "SleepModePrefs.bundle: OK"
          echo "Root.plist: OK"
          echo "icon.png: OK"
          echo "PreferenceLoader: OK"


          # =================================================
          # PLIST
          # =================================================

          echo ""
          echo "================================"
          echo "CHECK PLISTS"
          echo "================================"

          plutil -lint \
            "$PREF_BUNDLE/Root.plist"

          plutil -lint \
            "$PREF_ENTRY"

          echo "Root.plist: OK"
          echo "PreferenceLoader plist: OK"


          # =================================================
          # SETTINGS KEYS
          # =================================================

          echo ""
          echo "================================"
          echo "CHECK SETTINGS KEYS"
          echo "================================"

          grep -q \
            "SleepModeEnabled" \
            "$PREF_BUNDLE/Root.plist"

          grep -q \
            "SleepModeTimeout" \
            "$PREF_BUNDLE/Root.plist"

          grep -q \
            "SleepModePrefsListController" \
            "$PREF_ENTRY"

          grep -q \
            "com.trantu.sleepmode.settingsChanged" \
            "$PREF_BUNDLE/Root.plist"

          echo "SleepModeEnabled: OK"
          echo "SleepModeTimeout: OK"
          echo "Controller: OK"
          echo "Darwin notification: OK"


          # =================================================
          # CONTROL CENTER
          # =================================================

          echo ""
          echo "================================"
          echo "CHECK CONTROL CENTER"
          echo "================================"

          if find /tmp/final-sleepmode \
            -type f \
            | grep -Ei \
              "SleepModeModule|SleepModeProvider|SleepControlCenter"; then

            echo ""
            echo "ERROR:"
            echo "Control Center component found in final DEB."

            exit 1
          fi

          echo "Control Center: NOT PACKAGED"


          # =================================================
          # PACKAGE INFO
          # =================================================

          echo ""
          echo "================================"
          echo "PACKAGE INFO"
          echo "================================"

          dpkg-deb -I "$DEB"


          # =================================================
          # FINAL
          # =================================================

          echo ""
          echo "================================"
          echo "BUILD SUCCESS"
          echo "================================"

          echo ""
          echo "Final DEB:"
          echo "$DEB"

          echo ""
          echo "Included:"
          echo "  [OK] SleepMode.dylib"
          echo "  [OK] SleepModePrefs.bundle"
          echo "  [OK] Root.plist"
          echo "  [OK] icon.png"
          echo "  [OK] PreferenceLoader plist"
          echo "  [OK] Settings controller"
          echo "  [OK] Darwin notification"
          echo "  [OK] Control Center removed"


      # =====================================================
      # 17. UPLOAD
      # =====================================================

      - name: Upload DEB
        uses: actions/upload-artifact@v4

        with:
          name: SleepMode-RootHide
          path: |
            SleepMode/packages/*.deb

          if-no-files-found: error
